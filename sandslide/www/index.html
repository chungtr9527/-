<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0F1233">
  <meta name="description" content="Sandslide (流沙方塊): tilt the board and every block slides like sand. Fair, offline, no timer.">
  <title>Sandslide 流沙方塊</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <canvas id="game" aria-hidden="true"></canvas>
  <div id="a11y" class="a11y"><div id="a11y-live" aria-live="polite"></div><div id="a11y-buttons"></div></div>
  <div id="overlay" class="overlay" hidden></div>

  <!-- 1. build flags + ids + config (pure data) -->
  <script src="js/build-flags.js"></script>

  <script src="js/board.js"></script>

  <script src="js/ui.js"></script>

  <script src="js/main.js"></script>
