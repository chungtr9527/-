<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>115學年 大學申請入學 篩選標準查詢</title>
<style>
:root {
  --primary: #4F6BF6;
  --primary-light: #EEF1FF;
  --primary-dark: #3451DB;
  --primary-glow: rgba(79,107,246,0.15);
  --success: #22C55E;
  --success-light: #ECFDF5;
  --warning: #F59E0B;
  --warning-light: #FFFBEB;
  --danger: #EF4444;
  --danger-light: #FEF2F2;
  --bg: #F5F6FA;
  --card: #FFFFFF;
  --gray-50: #F8FAFC;
  --gray-100: #F1F5F9;
  --gray-200: #E2E8F0;
  --gray-300: #CBD5E1;
  --gray-400: #94A3B8;
  --gray-500: #64748B;
  --gray-600: #475569;
  --gray-700: #334155;
  --gray-800: #1E293B;
  --gray-900: #0F172A;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow-xs: 0 1px 2px rgba(0,0,0,0.04);
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 6px rgba(0,0,0,0.05), 0 2px 4px rgba(0,0,0,0.04);
  --shadow-lg: 0 10px 25px rgba(0,0,0,0.08);
  --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  --bounce: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang TC", "Microsoft JhengHei", sans-serif;
  background: var(--bg);
  color: var(--gray-900);
  min-height: 100vh;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: contain;
}

/* Header */
.header {
  background: linear-gradient(135deg, #4F6BF6 0%, #7C5CFC 50%, #A855F7 100%);
  color: white;
  padding: 20px 20px 16px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 4px 20px rgba(79,107,246,0.25);
}
.header h1 { font-size: 20px; font-weight: 800; text-align: center; letter-spacing: 0.5px; }
.header .subtitle {
  font-size: 12px;
  opacity: 0.8;
  text-align: center;
  margin-top: 4px;
  font-weight: 500;
  letter-spacing: 0.3px;
}

/* Global Search */
.search-wrap {
  padding: 12px 16px 4px;
  background: linear-gradient(180deg, rgba(79,107,246,0.08) 0%, transparent 100%);
}
.search-box {
  display: flex;
  align-items: center;
  background: var(--card);
  border-radius: 14px;
  padding: 0 14px;
  border: 1.5px solid var(--gray-200);
  transition: all var(--transition);
  box-shadow: var(--shadow-sm);
}
.search-box:focus-within {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-glow), var(--shadow-sm);
}
.search-box svg {
  width: 18px; height: 18px;
  color: var(--gray-400);
  flex-shrink: 0;
  transition: color var(--transition);
}
.search-box:focus-within svg { color: var(--primary); }
.search-box input {
  flex: 1;
  border: none;
  background: none;
  padding: 12px 10px;
  font-size: 15px;
  outline: none;
  color: var(--gray-900);
  font-weight: 500;
}
.search-box input::placeholder { color: var(--gray-400); font-weight: 400; }
.search-box .clear-btn {
  background: var(--gray-200);
  border: none;
  color: var(--gray-500);
  width: 22px; height: 22px;
  border-radius: 50%;
  font-size: 12px;
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  transition: all var(--transition);
}
.search-box .clear-btn.show { display: flex; }
.search-box .clear-btn:active { background: var(--gray-300); transform: scale(0.9); }

#globalSearchResults { padding: 8px 16px 16px; }
.search-result-count {
  font-size: 13px; color: var(--gray-500); margin-bottom: 10px; font-weight: 500;
  padding: 0 4px;
}

/* Tab Bar */
.tab-bar {
  display: flex;
  gap: 6px;
  padding: 8px 16px 6px;
  background: var(--bg);
  position: sticky;
  top: 60px;
  z-index: 90;
}
.tab-btn {
  flex: 1;
  padding: 10px 8px;
  border: none;
  background: var(--card);
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 600;
  color: var(--gray-500);
  cursor: pointer;
  transition: all var(--transition);
  box-shadow: var(--shadow-xs);
  position: relative;
  overflow: hidden;
}
.tab-btn::after {
  content: '';
  position: absolute;
  bottom: 0; left: 20%; right: 20%;
  height: 3px;
  background: var(--primary);
  border-radius: 3px 3px 0 0;
  transform: scaleX(0);
  transition: transform var(--transition);
}
.tab-btn.active {
  background: var(--primary-light);
  color: var(--primary);
  box-shadow: var(--shadow-sm);
}
.tab-btn.active::after { transform: scaleX(1); }
.tab-btn:active { transform: scale(0.96); }

/* Page System */
.page-container {
  position: relative;
  min-height: calc(100vh - 160px);
  min-height: calc(100dvh - 160px);
}
.tab-view { display: none; }
.tab-view.active { display: block; }
.page {
  display: none;
  padding: 12px 16px 32px;
  animation: pageIn 0.3s ease forwards;
}
.page.active { display: block; }
@keyframes pageIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Back Button */
.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  margin-bottom: 14px;
  background: var(--card);
  border: 1.5px solid var(--gray-200);
  border-radius: 24px;
  color: var(--primary);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--transition);
  box-shadow: var(--shadow-xs);
}
.back-btn:active { transform: scale(0.95); background: var(--primary-light); }
.back-btn svg { width: 16px; height: 16px; }

/* Category Grid */
.cat-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.cat-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 16px 8px 14px;
  text-align: center;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: all var(--transition);
  border: 2px solid transparent;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}
.cat-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--cat-color, var(--primary));
  opacity: 0;
  transition: opacity var(--transition);
}
.cat-card:active { transform: scale(0.96); }
.cat-card:active::before { opacity: 1; }
.cat-card .emoji { font-size: 28px; margin-bottom: 6px; }
.cat-card .label {
  font-size: 12px;
  font-weight: 700;
  color: var(--gray-700);
  line-height: 1.3;
}
.cat-card .count {
  font-size: 10px;
  color: var(--gray-400);
  margin-top: 3px;
  font-weight: 500;
}

/* List Items */
.list-item {
  background: var(--card);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  margin-bottom: 8px;
  box-shadow: var(--shadow-xs);
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: all var(--transition);
  border: 1.5px solid transparent;
}
.list-item:active {
  transform: scale(0.98);
  border-color: var(--primary-light);
  background: var(--gray-50);
}
.list-item .item-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--gray-800);
}
.list-item .item-badge {
  font-size: 12px;
  color: var(--primary);
  background: var(--primary-light);
  padding: 4px 12px;
  border-radius: 20px;
  flex-shrink: 0;
  font-weight: 600;
}

/* Dept Cards */
.dept-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 10px;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: all var(--transition);
  border-left: 4px solid var(--primary);
  position: relative;
  overflow: hidden;
}
.dept-card:active {
  transform: scale(0.98);
  box-shadow: var(--shadow-xs);
}
.dept-card .dept-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
}
.dept-card .dept-info { flex: 1; min-width: 0; }
.dept-card .dept-name {
  font-size: 15px;
  font-weight: 700;
  color: var(--gray-800);
  line-height: 1.35;
}
.dept-card .dept-school {
  font-size: 12px;
  color: var(--gray-500);
  margin-top: 2px;
  font-weight: 500;
}
.dept-card .dept-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}
.dept-card .enroll-chip {
  font-size: 11px;
  background: var(--primary-light);
  color: var(--primary);
  padding: 4px 10px;
  border-radius: 8px;
  font-weight: 700;
  white-space: nowrap;
}
.fav-btn {
  background: none;
  border: none;
  font-size: 22px;
  cursor: pointer;
  padding: 2px;
  line-height: 1;
  transition: transform var(--bounce);
  flex-shrink: 0;
}
.fav-btn:active { transform: scale(1.3); }
.fav-btn.active { animation: favPop 0.35s var(--bounce); }
@keyframes favPop {
  0% { transform: scale(1); }
  40% { transform: scale(1.4); }
  100% { transform: scale(1); }
}

/* Score Badges */
.score-row {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 10px;
}
.score-badge {
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 6px;
  font-weight: 600;
  letter-spacing: 0.2px;
}
.score-badge.high { background: var(--danger-light); color: var(--danger); }
.score-badge.mid { background: var(--warning-light); color: #B45309; }
.score-badge.low { background: var(--success-light); color: #15803D; }

/* Modal (Bottom Sheet) */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.5);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
.overlay.show { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--card);
  border-radius: 24px 24px 0 0;
  max-height: 88vh;
  max-height: 88dvh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 6px 22px 28px;
  padding-bottom: max(28px, var(--safe-bottom));
  z-index: 201;
  transform: translateY(100%);
  transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
  box-shadow: 0 -8px 40px rgba(0,0,0,0.12);
}
.overlay.show + .sheet,
.sheet.show { transform: translateY(0); }
.sheet-handle {
  width: 40px; height: 5px;
  background: var(--gray-300);
  border-radius: 3px;
  margin: 8px auto 18px;
}
.sheet .dept-title { font-size: 20px; font-weight: 800; color: var(--gray-900); line-height: 1.3; }
.sheet .school-name { font-size: 13px; color: var(--gray-500); margin-top: 3px; font-weight: 500; }
.sheet .chip-row { display: flex; gap: 6px; margin-top: 14px; flex-wrap: wrap; }
.sheet .chip {
  font-size: 12px; padding: 6px 14px; border-radius: 20px;
  background: var(--gray-100); color: var(--gray-600); font-weight: 600;
}
.sheet .section-head {
  font-size: 14px; font-weight: 700;
  margin-top: 22px; margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 2px solid var(--primary);
  color: var(--primary-dark);
  display: flex; align-items: center; gap: 6px;
}
.data-table { width: 100%; border-collapse: separate; border-spacing: 0; }
.data-table th, .data-table td {
  padding: 10px 8px; text-align: left; font-size: 13px;
  border-bottom: 1px solid var(--gray-100);
}
.data-table th { font-weight: 600; color: var(--gray-400); font-size: 12px; text-transform: uppercase; letter-spacing: 0.3px; }
.data-table .val { font-weight: 800; font-size: 18px; }
.progress-bar {
  height: 6px; border-radius: 3px; background: var(--gray-100);
  margin-top: 6px; overflow: hidden;
}
.progress-fill {
  height: 100%; border-radius: 3px;
  transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}

/* Compare Table */
.compare-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-top: 12px; padding-bottom: 20px; }
.cmp-table { width: 100%; min-width: 500px; border-collapse: separate; border-spacing: 0; font-size: 13px; }
.cmp-table th, .cmp-table td {
  padding: 10px 8px; text-align: center;
  border-bottom: 1px solid var(--gray-100);
  white-space: nowrap;
}
.cmp-table th {
  background: var(--gray-50); font-weight: 700; color: var(--gray-700);
  position: sticky; top: 0; z-index: 1;
}
.cmp-table th:first-child, .cmp-table td:first-child {
  text-align: left; position: sticky; left: 0;
  background: var(--card); z-index: 2;
  min-width: 80px; font-weight: 600; color: var(--gray-700);
}
.cmp-table th:first-child { background: var(--gray-50); z-index: 3; }
.cmp-table .sub { font-size: 11px; color: var(--gray-400); font-weight: 400; }

/* Favorites */
.fav-actions { display: flex; gap: 8px; margin-bottom: 14px; }
.action-btn {
  flex: 1; padding: 12px; border-radius: var(--radius-sm); border: none;
  font-size: 14px; font-weight: 700; cursor: pointer; transition: all var(--transition);
}
.action-btn:active { transform: scale(0.97); }
.action-btn.primary { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(79,107,246,0.3); }
.action-btn.outline { background: var(--card); color: var(--danger); border: 1.5px solid var(--gray-200); }

.fav-empty {
  text-align: center; padding: 60px 20px; color: var(--gray-500);
}
.fav-empty .icon { font-size: 56px; margin-bottom: 16px; opacity: 0.6; }
.fav-empty p { font-size: 14px; line-height: 1.6; }
.fav-badge {
  position: absolute;
  top: -2px; right: -2px;
  background: var(--danger);
  color: white;
  font-size: 10px;
  min-width: 18px; height: 18px;
  border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800;
  padding: 0 4px;
  box-shadow: 0 2px 6px rgba(239,68,68,0.3);
}

/* Empty State */
.empty-state { text-align: center; padding: 40px 20px; color: var(--gray-500); }
.empty-state p { font-size: 14px; }

.hidden { display: none !important; }

/* Section header for compare rows */
.section-row td {
  font-weight: 700 !important; font-size: 13px !important; text-align: left !important;
  padding: 10px 12px !important;
}

/* Scrollbar styling */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-thumb { background: var(--gray-300); border-radius: 4px; }
::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>

<div class="header">
  <h1>115 大學申請入學篩選標準</h1>
  <div class="subtitle">學年度 115 | 共 2,151 校系</div>
</div>

<div class="search-wrap">
  <div class="search-box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
    </svg>
    <input type="text" id="globalSearch" placeholder="搜尋校系、大學或代碼..." oninput="onGlobalSearch()" autocomplete="off">
    <button class="clear-btn" id="globalClearBtn" onclick="clearGlobalSearch()">✕</button>
  </div>
</div>

<div id="globalSearchResults" class="hidden"></div>

<div class="tab-bar" id="tabBar">
  <button class="tab-btn active" id="tabGroupDept" onclick="switchTab('groupDept')">學群科系</button>
  <button class="tab-btn" id="tabUniv" onclick="switchTab('univ')">各大學</button>
  <button class="tab-btn" id="tabFav" onclick="switchTab('fav')" style="position:relative">
    收藏比較<span class="fav-badge hidden" id="favBadge">0</span>
  </button>
</div>

<div class="page-container" id="pageContainer">
  <div id="tv-groupDept" class="tab-view active">
    <div class="page active" id="pg-catGrid"><div class="cat-grid" id="catGrid"></div></div>
    <div class="page" id="pg-deptGroups"><button class="back-btn" onclick="goBack()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>返回</button><div id="deptGroupsList"></div></div>
    <div class="page" id="pg-depts"><button class="back-btn" onclick="goBack()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>返回</button><div id="deptList"></div></div>
  </div>
  <div id="tv-univ" class="tab-view">
    <div class="page active" id="pg-univList">
      <div class="search-box" style="margin-bottom:12px;border-color:var(--gray-200)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="text" id="univSearch" placeholder="搜尋大學..." oninput="renderUnivList()" autocomplete="off">
      </div>
      <div id="univList"></div>
    </div>
    <div class="page" id="pg-univDeptGroups"><button class="back-btn" onclick="goBack()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>返回</button><div id="univDeptGroupsList"></div></div>
    <div class="page" id="pg-univDepts"><button class="back-btn" onclick="goBack()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>返回</button><div id="univDeptList"></div></div>
  </div>
  <div id="tv-fav" class="tab-view">
    <div class="page active" id="pg-favList">
      <div class="fav-actions" id="favActions" style="display:none">
        <button class="action-btn primary" onclick="showCompare()">比較已選校系</button>
        <button class="action-btn outline" onclick="clearAllFav()">清空</button>
      </div>
      <div id="favList"></div>
    </div>
    <div class="page" id="pg-compare"><button class="back-btn" onclick="goBack()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>返回收藏</button><div class="compare-wrap" id="compareBody"></div></div>
  </div>
</div>

<div class="overlay" id="overlay" onclick="closeSheet()"></div>
<div class="sheet" id="sheet" onclick="event.stopPropagation()">
  <div class="sheet-handle"></div>
  <div id="sheetBody"></div>

function normDept(name) {
  let s = name.replace(/^(?:國立|私立)?.+?大學/,'').trim();
  s = s.replace(/[（(][^)）]*[)）]/g,'').trim();
  s = s.replace(/[甲乙丙丁戊ABCDEFGH]\d*組?$/,'').trim();
  s = s.replace(/(英語|全英語|公費生|薪傳|青年儲蓄帳戶)組?$/,'').trim();
  s = s.replace(/[A-Za-z0-9一二三四五六]+組$/,'').trim();
  s = s.replace(/學系全英語學士班$/, '學系').trim();
  s = s.replace(/專業學院學士班$/, '學系').trim();
  s = s.replace(/雙學士學位學程.*$/, '學系').trim();
  s = s.replace(/國際學士學位學程.*$/, '學系').trim();
  s = s.replace(/學士學位學程.*$/, '學系').trim();
  s = s.replace(/英語學士班$/, '學系').trim();
  s = s.replace(/(學系).+組$/, '$1').trim();
  return s;
}

// Favorites
let favSet = new Set(JSON.parse(localStorage.getItem('fav115') || '[]'));
function saveFav() { localStorage.setItem('fav115', JSON.stringify([...favSet])); updateBadge(); }
function toggleFav(code, e) {
  if (e) { e.stopPropagation(); e.preventDefault(); }
  favSet.has(code) ? favSet.delete(code) : favSet.add(code);
  saveFav();
  document.querySelectorAll(`[data-fav="${code}"]`).forEach(el => {
    el.textContent = favSet.has(code) ? '❤️' : '🤍';
    if (favSet.has(code)) { el.classList.add('active'); } else { el.classList.remove('active'); }
  });
  if (curTab === 'fav') renderFavList();
}
function updateBadge() {
  const b = document.getElementById('favBadge');
  b.textContent = favSet.size;
  favSet.size > 0 ? b.classList.remove('hidden') : b.classList.add('hidden');
}
function clearAllFav() { favSet.clear(); saveFav(); renderFavList(); }

// Navigation
let navStack = [], curTab = 'groupDept';
function showPage(id) {
  const tv = document.querySelector('.tab-view.active');
  tv.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const pg = document.getElementById(id);
  if (pg) { pg.classList.add('active'); pg.style.animation = 'none'; pg.offsetHeight; pg.style.animation = ''; }
}
function navTo(id, state = {}) { navStack.push({ id, state }); showPage(id); }
function goBack() {
  if (navStack.length > 1) { navStack.pop(); showPage(navStack[navStack.length-1].id); }
}

function switchTab(tab) {
  curTab = tab; navStack = [];
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-view').forEach(v => { v.classList.remove('active'); });
  const tabMap = { groupDept: ['tabGroupDept','tv-groupDept','pg-catGrid'], univ: ['tabUniv','tv-univ','pg-univList'], fav: ['tabFav','tv-fav','pg-favList'] };
  const [btnId, tvId, pgId] = tabMap[tab];
  document.getElementById(btnId).classList.add('active');
  const tv = document.getElementById(tvId);
  tv.classList.add('active');
  navStack = [{ id: pgId }];
  showPage(pgId);
  if (tab === 'groupDept') buildCatGrid();
  else if (tab === 'univ') renderUnivList();
  else if (tab === 'fav') renderFavList();
}

function getPrimaryCat(d) {
  if (d.categories.length <= 1) return d.categories[0];
  let best = d.categories[0], bestScore = -1;
  for (const cat of d.categories) {
    let score = 0;
    for (const kw of (CAT_KW[cat]||[])) { if ((d.dept||'').includes(kw)) score += kw.length; }
    if (score > bestScore) { bestScore = score; best = cat; }
  }
  return best;
}

// Build Category Grid
function buildCatGrid() {
  const cats = Object.keys(CAT_INFO).sort();
  document.getElementById('catGrid').innerHTML = cats.map((cat, i) => {
    const count = DATA.filter(d => getPrimaryCat(d) === cat).length;
    const info = CAT_INFO[cat];
    return `<div class="cat-card" style="--cat-color:${info.color};animation-delay:${i*30}ms" onclick="selectCat('${cat.replace(/'/g,"\\'")}')">
      <div class="emoji">${info.emoji}</div>
      <div class="label">${cat}</div>
      <div class="count">${count} 校系</div>
    </div>`;
  }).join('');
}

function selectCat(cat) {
  const entries = DATA.filter(d => getPrimaryCat(d) === cat);
  const groups = {};
  entries.forEach(d => { const k = getDeptGroup(d.dept||d.school); if (!groups[k]) groups[k]=[]; groups[k].push(d); });
  const sorted = Object.entries(groups).sort((a,b)=>b[1].length-a[1].length);
  document.getElementById('deptGroupsList').innerHTML = sorted.map(([name, items]) =>
    `<div class="list-item" onclick="selectDeptGroup('${name.replace(/'/g,"\\'")}')"><span class="item-name">${name}</span><span class="item-badge">${items.length}</span></div>`
  ).join('');
  navTo('pg-deptGroups', { cat });
}

function selectDeptGroup(name) {
  const items = DEPT_KW_MAP[name];
  if (!items) return;
  document.getElementById('deptList').innerHTML = items.map(d => renderCard(d)).join('');
  navTo('pg-depts', { group: name });
}

function renderUnivList() {
  const q = (document.getElementById('univSearch')?.value||'').trim().toLowerCase();
  const filtered = UNIV_LIST.filter(u => u.toLowerCase().includes(q));
  document.getElementById('univList').innerHTML = filtered.map(u =>
    `<div class="list-item" onclick="selectUniv('${u.replace(/'/g,"\\'")}')"><span class="item-name">${u}</span><span class="item-badge">${UNIV_MAP[u].length}</span></div>`
  ).join('') || '<div class="empty-state"><p>找不到相符的大學</p></div>';
}

function selectUniv(univ) {
  const items = UNIV_MAP[univ]; if (!items) return;
  const groups = {};
  items.forEach(d => { const k = getDeptGroup(d.dept||d.school); if (!groups[k]) groups[k]=[]; groups[k].push(d); });
  const sorted = Object.entries(groups).sort((a,b)=>b[1].length-a[1].length);
  if (sorted.length <= 1) {
    document.getElementById('univDeptList').innerHTML = items.map(d => renderCard(d)).join('');
    navTo('pg-univDepts', { univ });
    return;
  }
  document.getElementById('univDeptGroupsList').innerHTML = sorted.map(([name, gi]) =>
    `<div class="list-item" onclick="selectUnivDG('${univ.replace(/'/g,"\\'")}','${name.replace(/'/g,"\\'")}')"><span class="item-name">${name}</span><span class="item-badge">${gi.length}</span></div>`
  ).join('');
  navTo('pg-univDeptGroups', { univ });
}

function selectUnivDG(univ, group) {
  const items = (UNIV_MAP[univ]||[]).filter(d => getDeptGroup(d.dept||d.school) === group);
  document.getElementById('univDeptList').innerHTML = items.map(d => renderCard(d)).join('');
  navTo('pg-univDepts', { univ, group });
}

function renderCard(d) {
  const scores = Object.entries(d.scores).map(([k,v]) => {
    const cls = typeof v==='number' ? (v>=13?'high':v>=10?'mid':'low') : 'mid';
    return `<span class="score-badge ${cls}">${k}: ${v}</span>`;
  }).join('');
  const heart = favSet.has(d.code) ? '❤️' : '🤍';
  return `<div class="dept-card" onclick="openSheet('${d.code}')">
    <div class="dept-top">
      <div class="dept-info"><div class="dept-name">${d.dept||d.school}</div><div class="dept-school">${d.dept?d.school:getBaseUniv(d.school)}</div></div>
      <div class="dept-meta">
        <button class="fav-btn ${favSet.has(d.code)?'active':''}" data-fav="${d.code}" onclick="toggleFav('${d.code}',event)">${heart}</button>
        <div class="enroll-chip">${d.enrollment}名</div>
      </div>
    </div>
    ${scores ? '<div class="score-row">'+scores+'</div>' : ''}
  </div>`;
}

  let h = `<div style="display:flex;align-items:flex-start;gap:10px">
    <div style="flex:1;min-width:0"><div class="dept-title">${d.dept}</div><div class="school-name">${d.school}</div></div>
    <button class="fav-btn ${favSet.has(d.code)?'active':''}" data-fav="${d.code}" onclick="toggleFav('${d.code}',event)" style="font-size:26px">${heart}</button>
  </div>
  <div class="chip-row">
    <span class="chip">🎓 招生 ${d.enrollment} 名</span>
    <span class="chip">📋 ${d.code}</span>
    ${d.categories.map(c=>`<span class="chip" style="background:${CAT_INFO[c]?.color||'#666'}18;color:${CAT_INFO[c]?.color||'#666'}">${c}</span>`).join('')}
  </div>`;

  if (Object.keys(d.standards).length) {
    h += '<div class="section-head">✅ 檢定標準 / 篩選倍率</div><table class="data-table"><tr><th>科目</th><th>檢定</th><th>倍率</th></tr>';
    for (const [subj, info] of Object.entries(d.standards)) {
      const p = info.split('/');
      h += `<tr><td style="font-weight:600">${subj}</td><td>${p[0]||'--'}</td><td style="font-weight:700;color:var(--primary)">${p[1]||'--'}</td></tr>`;
    }
    h += '</table>';
  }
  if (Object.keys(d.scores).length) {
    h += '<div class="section-head">🎯 通過篩選最低級分</div><table class="data-table">';
    Object.entries(d.scores).forEach(([key,val],i) => {
      const n = typeof val==='number'?val:0;
      const pct = Math.round((n/15)*100);
      const color = n>=13?'var(--danger)':n>=10?'var(--warning)':'var(--success)';
      h += `<tr><td style="font-weight:600">篩選${['①','②','③','④','⑤','⑥'][i]||i+1} ${key}</td>
        <td><span class="val" style="color:${color}">${val}</span>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${color}"></div></div></td></tr>`;
    });
    h += '</table>';
  }
  
  if (d.variants && d.variants.length) {
    h += '<div class="section-head">📋 其他招生管道</div>';
    d.variants.forEach(v => {
      h += '<div style="background:var(--primary-light);border-radius:10px;padding:12px;margin-bottom:10px">';
      h += '<div style="font-weight:700;color:var(--primary-dark);margin-bottom:6px">🔹 ' + v.label + ' <span style="font-size:12px;color:var(--gray-500);font-weight:500">代號 ' + v.code + '｜招生 ' + v.quota + ' 名</span></div>';
      if (v.standards && Object.keys(v.standards).length) {
        h += '<table class="data-table" style="margin-top:6px"><tr><th>科目</th><th>檢定</th><th>倍率</th></tr>';
        for (const [subj, info] of Object.entries(v.standards)) {
          const p = info.split('/');
          h += '<tr><td style="font-weight:600">' + subj + '</td><td>' + (p[0]||'--') + '</td><td style="font-weight:700;color:var(--primary)">' + (p[1]||'--') + '</td></tr>';
        }
        h += '</table>';
      }
      if (v.scores && Object.keys(v.scores).length) {
        h += '<table class="data-table" style="margin-top:6px">';
        Object.entries(v.scores).forEach(([key,val],i) => {
          const n = typeof val==='number'?val:0;
          const color = n>=13?'var(--danger)':n>=10?'var(--warning)':'var(--success)';
          h += '<tr><td style="font-weight:600;font-size:13px">篩選 ' + key + '</td><td style="font-weight:700;color:'+color+'">' + val + '</td></tr>';
        });
        h += '</table>';
      }
      h += '</div>';
    });
  }
  
  document.getElementById('sheetBody').innerHTML = h;
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeSheet() {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
  document.body.style.overflow = '';
}

// Favorites
function renderFavList() {
  const items = [...favSet].map(c => DATA.find(x=>x.code===c)).filter(Boolean);
  const fa = document.getElementById('favActions');
  if (!items.length) {
    fa.style.display = 'none';
    document.getElementById('favList').innerHTML = '<div class="fav-empty"><div class="icon">🤍</div><p>尚未收藏任何校系</p><p style="margin-top:8px;font-size:12px;color:var(--gray-400)">在校系卡片上點擊愛心即可收藏</p></div>';
    return;
  }
  fa.style.display = 'flex';
  document.getElementById('favList').innerHTML = items.map(d => renderCard(d)).join('');
}

function showCompare() {
  const items = [...favSet].map(c=>DATA.find(x=>x.code===c)).filter(Boolean);
  if (items.length<2) { alert('請至少收藏 2 個校系才能比較'); return; }
  const allKeys = new Set(); items.forEach(d => Object.keys(d.standards).forEach(k => allKeys.add(k)));
  const maxR = Math.max(...items.map(d => Object.keys(d.scores).length));

  let h = '<table class="cmp-table"><thead><tr><th></th>';
  items.forEach(d => { h += `<th>${d.dept}<br><span class="sub">${d.school}</span></th>`; });
  h += '</tr></thead><tbody>';
  h += '<tr><td>🎓 招生</td>'; items.forEach(d => { h += `<td>${d.enrollment}名</td>`; }); h += '</tr>';

  h += `<tr class="section-row"><td colspan="${items.length+1}" style="background:var(--primary-light);color:var(--primary-dark)">✅ 檢定標準</td></tr>`;
  [...allKeys].forEach(key => {
    h += `<tr><td>${key}</td>`;
    items.forEach(d => { const info=d.standards[key]; h += info ? `<td>${info.split('/')[0]||'--'}</td>` : '<td style="color:var(--gray-300)">--</td>'; });
    h += '</tr>';
  });

  h += `<tr class="section-row"><td colspan="${items.length+1}" style="background:var(--warning-light);color:#B45309">📊 篩選倍率</td></tr>`;
  [...allKeys].forEach(key => {
    if (!items.some(d => { const i=d.standards[key]; return i && i.split('/')[1]?.trim(); })) return;
    h += `<tr><td>${key}</td>`;
    items.forEach(d => { const i=d.standards[key]; const p=i?i.split('/'):['',''];
      h += `<td>${p[1]?.trim()||'--'}</td>`; });
    h += '</tr>';
  });

  if (maxR>0) {
    h += `<tr class="section-row"><td colspan="${items.length+1}" style="background:var(--danger-light);color:var(--danger)">🎯 通過篩選最低級分</td></tr>`;
    const cn = ['①','②','③','④','⑤','⑥','⑦','⑧'];
    for (let i=0;i<maxR;i++) {
      h += `<tr><td>篩選${cn[i]||i+1}</td>`;
      items.forEach(d => {
        const e = Object.entries(d.scores);
        if (i<e.length) {
          const [k,v]=e[i]; const n=typeof v==='number'?v:0;
          const c = n>=13?'var(--danger)':n>=10?'var(--warning)':'var(--success)';
          h += `<td><span style="font-weight:800;color:${c}">${v}</span><br><span style="font-size:11px;color:var(--gray-400)">${k}</span></td>`;
        } else h += '<td style="color:var(--gray-300)">--</td>';
      });
      h += '</tr>';
    }
  }
  h += '</tbody></table>';
  document.getElementById('compareBody').innerHTML = h;
  navTo('pg-compare');
}

// Global Search
let searchTimer = null;
function onGlobalSearch() {
  const q = (document.getElementById('globalSearch').value||'').trim();
  const clr = document.getElementById('globalClearBtn');
  const res = document.getElementById('globalSearchResults');
  const bar = document.getElementById('tabBar');
  const pc = document.getElementById('pageContainer');
  if (!q) { clr.classList.remove('show'); res.classList.add('hidden'); bar.classList.remove('hidden'); pc.classList.remove('hidden'); return; }
  clr.classList.add('show');
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    const ql = q.toLowerCase();
    const results = DATA.filter(d => d.dept.toLowerCase().includes(ql) || d.school.toLowerCase().includes(ql) || d.code.includes(ql));
    bar.classList.add('hidden'); pc.classList.add('hidden'); res.classList.remove('hidden');
    if (!results.length) { res.innerHTML = '<div class="empty-state"><p>找不到「'+q+'」相關的校系</p></div>'; return; }
    let h = '<div class="search-result-count">找到 '+results.length+' 個校系</div>';
    h += results.slice(0,50).map(d => renderCard(d)).join('');
    if (results.length>50) h += '<div style="text-align:center;padding:16px;color:var(--gray-400);font-size:13px">還有 '+(results.length-50)+' 個結果，請輸入更精確的關鍵字</div>';
    res.innerHTML = h;
  }, 150);
}
function clearGlobalSearch() {
  document.getElementById('globalSearch').value = '';
  onGlobalSearch();
  document.getElementById('globalSearch').focus();
}

// Touch gestures for sheet
let sheetStartY = 0, sheetCurrentY = 0;
document.getElementById('sheet').addEventListener('touchstart', e => {
  if (e.target.closest('.data-table, .cmp-table')) return;
  sheetStartY = e.touches[0].clientY;
}, { passive: true });
document.getElementById('sheet').addEventListener('touchmove', e => {
  sheetCurrentY = e.touches[0].clientY;
  const dy = sheetCurrentY - sheetStartY;
  if (dy > 0 && document.getElementById('sheet').scrollTop <= 0) {
    document.getElementById('sheet').style.transform = `translateY(${dy}px)`;
  }
}, { passive: true });
document.getElementById('sheet').addEventListener('touchend', () => {
  const dy = sheetCurrentY - sheetStartY;
  const sheet = document.getElementById('sheet');
  sheet.style.transform = '';
  if (dy > 100) closeSheet();
});

// Init
navStack = [{ id: 'pg-catGrid' }];
buildCatGrid();
updateBadge();
</script>
