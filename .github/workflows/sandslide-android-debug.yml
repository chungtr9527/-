name: sandslide-android-debug
on:
  push:
    paths: ['sandslide/**', '.github/workflows/sandslide-android-debug.yml']
  workflow_dispatch:
jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sandslide
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sandslide/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci
      - name: Sync web assets into the Android project (dev flags = Google test ad ids)
        run: npm run flags:dev && npx cap sync android
      - name: Build debug APK (signed with the committed android/app/debug.keystore)
        run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: sandslide-debug-${{ github.sha }}
          path: sandslide/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
