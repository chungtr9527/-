name: sandslide-ci
on:
  push:
    paths: ['sandslide/**', '.github/workflows/sandslide-ci.yml']
  pull_request:
    paths: ['sandslide/**', '.github/workflows/sandslide-ci.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sandslide
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sandslide/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E
        run: |
          if ls test/e2e/*.test.js >/dev/null 2>&1; then npm run e2e; else echo "no e2e tests yet"; fi
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-artifacts
          path: sandslide/test-results
          if-no-files-found: ignore
