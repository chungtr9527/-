name: sandslide-android-release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sandslide
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate tag
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            V="${GITHUB_REF_NAME#v}"; IFS=. read -r MA MI PA <<< "$V"
            echo "APP_VERSION=$V" >> "$GITHUB_ENV"; echo "APP_VERSION_CODE=$((MA*10000+MI*100+PA))" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=0.0.0-$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"; echo "APP_VERSION_CODE=1" >> "$GITHUB_ENV"
            echo "::warning::not a release tag; building an unsigned dry run"
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sandslide/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm test
      - name: Switch to production build flags
        run: npm run flags:release
      - name: Gate - no test ids or placeholders in the web build or strings
        run: |
          if grep -rEl '3940256099942544|REPLACE' www/js android/app/src/main/res/values/strings.xml; then
            echo "::error::test ad ids or REPLACE placeholders found in the release sources"; exit 1; fi
          node -e "const f=require('./www/js/build-flags.js');" || true
          grep -q "\"env\":\"prod\"" www/js/build-flags.js
      - run: npx cap sync android
      - name: Decode upload keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload.jks
      - name: Build release AAB + APK
        env:
          KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && format('{0}/sandslide/android/app/upload.jks', github.workspace) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace -PappVersionName="$APP_VERSION" -PappVersionCode="$APP_VERSION_CODE"
      - name: Gate - no test ids inside the bundle, no native libraries (16 KB page-size compliance)
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          if unzip -p "$AAB" 'base/assets/public/js/*.js' | grep -c 3940256099942544 | grep -qv '^0$'; then echo "::error::test ad ids inside the bundle"; exit 1; fi
          if unzip -l "$AAB" | grep -E 'lib/.*\.so$'; then echo "::error::native libraries found; verify 16 KB alignment"; exit 1; fi
          echo "bundle gates passed"
      - name: Collect outputs
        run: |
          mkdir -p out
          cp android/app/build/outputs/bundle/release/app-release.aab out/sandslide-$APP_VERSION.aab
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1); cp "$APK" out/sandslide-$APP_VERSION.apk
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then for f in out/*; do mv "$f" "${f%.*}-unsigned.${f##*.}"; done; fi
          ls -la out
      - uses: actions/upload-artifact@v7
        with:
          name: sandslide-release-${{ env.APP_VERSION }}
          path: sandslide/out/*
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$GITHUB_REF_NAME" out/* --generate-notes --title "Sandslide $APP_VERSION"
